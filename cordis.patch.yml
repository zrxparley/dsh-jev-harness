- insert:
    - id: jev-harness
      name: '@zrxparley/dsh-jev-harness'
      config:
        jevBaseUrl: ''
        kimiBaseUrl: ''
        dsfBaseUrl: ''
        jevApiKey: ''
        kimiApiKey: ''
        dsfApiKey: ''
        kimiModel: 'kimi-k3.1-pro'
        dsfModel: 'deepseek-v4.1-flash-1017'
        jevModel: 'jev-latest'
        routeMode: 'dsh'
        # 留空 = 自动从这台机器的 DSH 网关里挑（面板里可钉住）
        decisionProvider: ''
        decisionModel: ''
        executionProvider: ''
        executionModel: ''
        skillsAuto: true
        skillsRepo: 'mattpocock/skills'
        skillsRef: 'main'
        skillsMaxChars: 6000
        timeoutMs: 120000
        temperature: 0.2
